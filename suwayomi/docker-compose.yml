version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: suwayomi_server_1
      APP_PORT: 4567

  server:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    # The image ships as non-root (UID 1000), which matches Umbrel's data dir owner.
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      TZ: ${TZ}
    volumes:
      # Library, downloads and settings all live under the Tachidesk data dir.
      - ${APP_DATA_DIR}/data:/home/suwayomi/.local/share/Tachidesk
